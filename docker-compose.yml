# Run everything:      docker compose up --build
# Database only (dev): docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: sweety-db
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the extra sweety_test database on first start
      - ./server/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: sweety-server
    environment:
      PORT: 5000
      DATABASE_URL: postgres://sweety:sweety@db:5432/sweety
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me}
      JWT_EXPIRES_IN: 1d
      CLIENT_ORIGIN: http://localhost:3000
      # "Today" (for the future-date rule) uses this timezone. Containers default to UTC.
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: sweety-client
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
