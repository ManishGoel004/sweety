services:
  db:
    image: postgres:16-alpine
    container_name: sweety-db
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the extra sweety_test database on first start
      - ./server/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
